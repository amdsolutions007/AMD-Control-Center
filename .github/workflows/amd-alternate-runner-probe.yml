name: AMD Alternate Runner Probe

on:
  push:
    branches:
      - music-intel/phase02-first-party-attribution

jobs:
  probe-windows:
    runs-on: windows-latest
    steps:
      - name: Windows runner started
        shell: pwsh
        run: Write-Output "AMD_WINDOWS_RUNNER_OK"

  probe-macos:
    runs-on: macos-latest
    steps:
      - name: macOS runner started
        run: echo "AMD_MACOS_RUNNER_OK"
