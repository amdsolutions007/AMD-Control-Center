name: Wave 4 Rehydration Validation

on:
  push:
    branches:
      - growth-ops/location-wave-4-rehydrated-release

permissions:
  contents: write

jobs:
  validate-and-freeze:
    if: ${{ !contains(github.event.head_commit.message, '[rehydrated]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Restore bounded Wave 4 payload
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/wave4-payload.b64 <<'PAYLOAD'
[... truncated for display ...]
PAYLOAD
          base64 --decode /tmp/wave4-payload.b64 > /tmp/wave4-payload.tar.gz
          tar -xzf /tmp/wave4-payload.tar.gz -C "$GITHUB_WORKSPACE"

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/website/package-lock.json

      - name: Install locked dependencies
        working-directory: apps/website
        run: npm ci

      - name: Regenerate deferred migration map
        working-directory: apps/website
        run: npm run generate:locations:wave4

      - name: Static truth SEO and governance validation
        working-directory: apps/website
        run: npm run validate:locations:wave4

      - name: TypeScript
        working-directory: apps/website
        run: npx tsc --noEmit --incremental false

      - name: Production build
        working-directory: apps/website
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.invalid
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder
        run: npm run build

      - name: Runtime and legacy regression
        working-directory: apps/website
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.invalid
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder
        run: |
          set -euo pipefail
          npm run start -- -H 127.0.0.1 -p 3104 > /tmp/wave4-next.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:3104/locations/nigeria >/dev/null; then
              break
            fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:3104/locations/nigeria >/dev/null
          npm run smoke:locations:wave4 -- http://127.0.0.1:3104

      - name: Freeze validated release checkpoint
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "AMD Growth Ops 007"
          git config user.email "amdmediaoffice@gmail.com"
          git add .github/workflows/wave4-rehydration-validation.yml .gitignore apps/website/package.json apps/website/src/app/locations apps/website/src/components/location apps/website/src/lib/location-network.ts apps/website/src/data/location-base.json apps/website/src/data/location-governance.json apps/website/src/data/location-wave-3.json apps/website/src/data/location-wave-4.json apps/website/scripts/generate-location-migration-map.mjs apps/website/scripts/validate-location-wave-4.mjs apps/website/scripts/smoke-location-wave-4-runtime.mjs apps/website/scripts/certify-location-wave-4-mobile.mjs apps/website/docs/location-architecture/migration-map-wave-4.csv apps/website/docs/location-architecture/validation-report-wave-4.json apps/website/docs/location-architecture/runtime-validation-wave-4.json apps/website/docs/location-architecture/mobile-certification-wave-4.json
          git status --short
          git commit -m "feat(wave4): [rehydrated] durable release checkpoint"
          git push origin HEAD:growth-ops/location-wave-4-rehydrated-release

      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wave4-rehydration-validation
          path: |
            apps/website/docs/location-architecture/validation-report-wave-4.json
            apps/website/docs/location-architecture/runtime-validation-wave-4.json
            apps/website/docs/location-architecture/migration-map-wave-4.csv
