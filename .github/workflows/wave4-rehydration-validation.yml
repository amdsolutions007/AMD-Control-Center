name: Wave 4 Rehydration Validation

on:
  push:
    branches:
      - growth-ops/location-wave-4-rehydrated-release

permissions:
  contents: write

jobs:
  validate-and-freeze:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout candidate
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Restore bounded source payload
        shell: bash
        run: |
          set -euo pipefail
          test -f .wave4-rehydrate/payload.b64
          base64 --decode .wave4-rehydrate/payload.b64 > /tmp/wave4-rehydrate.tar.gz
          echo "152145246bb4167c14df621a7ec9688c26df4b74c432936a91e92224c30d9363  /tmp/wave4-rehydrate.tar.gz" | sha256sum -c -
          tar -xzf /tmp/wave4-rehydrate.tar.gz -C "$GITHUB_WORKSPACE"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/website/package-lock.json

      - name: Install locked dependencies
        working-directory: apps/website
        run: npm ci

      - name: Generate deferred migration map
        working-directory: apps/website
        run: npm run generate:locations:wave4

      - name: Static truth SEO governance and similarity gate
        working-directory: apps/website
        run: npm run validate:locations:wave4

      - name: TypeScript
        working-directory: apps/website
        run: npx tsc --noEmit --incremental false

      - name: Full production build
        working-directory: apps/website
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.invalid
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder
        run: npm run build

      - name: Runtime 22-route and legacy regression
        working-directory: apps/website
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.invalid
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder
        run: |
          set -euo pipefail
          npm run start -- -H 127.0.0.1 -p 3104 > /tmp/wave4-next.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:3104/locations/nigeria >/dev/null; then
              break
            fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:3104/locations/nigeria >/dev/null
          npm run smoke:locations:wave4 -- http://127.0.0.1:3104

      - name: Freeze durable validated release checkpoint
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "AMD Growth Ops 007"
          git config user.email "amdmediaoffice@gmail.com"
          rm -rf .wave4-rehydrate
          git add -A
          git status --short
          git commit -m "feat(wave4): [rehydrated] durable release checkpoint"
          git push origin HEAD:growth-ops/location-wave-4-rehydrated-release

      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wave4-rehydration-validation
          path: |
            apps/website/docs/location-architecture/validation-report-wave-4.json
            apps/website/docs/location-architecture/runtime-validation-wave-4.json
            apps/website/docs/location-architecture/migration-map-wave-4.csv
