# Ghost Writer Pro - Railway Configuration
# IMPORTANT: Railway doesn't support multiple services in one repo via railway.toml
# Services must be created separately via Railway Dashboard

# Instructions:
# 1. Go to Railway Dashboard
# 2. Click "New Service" → "Deploy from GitHub repo"
# 3. Select AMD-Control-Center
# 4. Create Service 1:
#    - Name: ghostwriter-telegram-bot
#    - Dockerfile: Dockerfile.telegram
# 5. Create Service 2:
#    - Name: ghostwriter-poster  
#    - Dockerfile: Dockerfile.ghostwriter
